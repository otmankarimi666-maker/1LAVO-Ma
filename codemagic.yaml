workflows:
  android-workflow:
    name: 1LAVO Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Fix project location
        script: |
          echo "Listing root:"
          ls -la
          if [ ! -f pubspec.yaml ]; then
            FOUND=$(find . -name "pubspec.yaml" | head -1)
            echo "Found pubspec at: $FOUND"
            DIR=$(dirname "$FOUND")
            echo "Moving files from $DIR to root..."
            cp -r $DIR/* . 2>/dev/null || true
            cp -r $DIR/.* . 2>/dev/null || true
            ls -la
          fi
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
  ios-workflow:
    name: 1LAVO iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Fix project location
        script: |
          if [ ! -f pubspec.yaml ]; then
            FOUND=$(find . -name "pubspec.yaml" | head -1)
            DIR=$(dirname "$FOUND")
            cp -r $DIR/* . 2>/dev/null || true
            cp -r $DIR/.* . 2>/dev/null || true
          fi
      - name: Get packages
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
